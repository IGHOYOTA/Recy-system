services:
  - type: web
    name: recy-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: gunicorn recy.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 60 --access-logfile -
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: RECY_REQUIRE_POSTGRES
        value: "1"
      - key: DATABASE_URL
        sync: false
      - key: RECY_API_KEY
        generateValue: true
