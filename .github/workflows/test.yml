name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: recy_test_only
          POSTGRES_DB: recy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recy_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:recy_test_only@localhost:5432/recy_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .
      - run: python -m unittest discover -v
      - run: node --input-type=module --check < recy/frontend/app.js
      - run: node --input-type=module --check < recy/frontend/api.js
