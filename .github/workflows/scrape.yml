name: Refresh Return-It registry

on:
  push:
    branches: [main]
    paths:
      - 'recy/source.py'
      - 'recy/scheduled.py'
      - 'recy/refresh.py'
      - 'recy/postgres.py'
      - 'recy/__main__.py'
      - 'pyproject.toml'
      - 'recy/migrations/005_source_refresh_schedule.sql'
      - '.github/workflows/scrape.yml'
  schedule:
    # B.C. uses permanent Pacific time (UTC-7) from March 2026. Newer source dates queue next midnight.
    - cron: '23 6 * * *'
    - cron: '0 7 * * *'
    # Resume only a due changed-version job after an interruption or time budget.
    - cron: '15 10,13,16 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check the site date or run/resume an already-due job'
        type: choice
        options: [check, scrape]
        default: check

permissions:
  contents: read

concurrency:
  group: recy-registry-sync
  cancel-in-progress: false

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RECY_REQUIRE_POSTGRES: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .
      - name: Validate database configuration
        run: python -c "import os; assert os.environ.get('DATABASE_URL'), 'Set the DATABASE_URL repository secret'"
      - name: Initialize registry and source-only scheduling state
        run: |
          python -m recy init-db
          python -m recy init-source-monitor
      - name: Check published source date and queue next midnight
        if: github.event_name == 'push' || github.event.schedule == '23 6 * * *' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'check')
        run: python -m recy check-source-update --timezone America/Vancouver
      - name: Run or resume a changed version only when its midnight is due
        if: (github.event_name == 'schedule' && github.event.schedule != '23 6 * * *') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'scrape')
        run: python -m recy scheduled-sync --max-seconds 10800
